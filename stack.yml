version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--providers.docker=true"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@example.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certificates:/letsencrypt"
    networks:
      - public
    deploy:
      placement:
        constraints: [node.role == manager]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal

  server:
    image: ${REGISTRY:-localhost:5000}/michelin-server
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-5e8e7a8e7a8e7a8e7a8e7a8e7a8e7a8e}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    networks:
      - internal
      - public

  server-nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx-api.conf:/etc/nginx/conf.d/default.conf
    networks:
      - public
      - internal
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`api.votre-domaine.com`)"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.routers.api.tls.certresolver=myresolver"
        - "traefik.http.services.api.loadbalancer.server.port=80"

  client:
    image: ${REGISTRY:-localhost:5000}/michelin-client
    networks:
      - public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.client.rule=Host(`votre-domaine.com`)"
        - "traefik.http.routers.client.entrypoints=websecure"
        - "traefik.http.routers.client.tls.certresolver=myresolver"
        - "traefik.http.services.client.loadbalancer.server.port=80"

  mobile:
    image: ${REGISTRY:-localhost:5000}/michelin-mobile
    networks:
      - public
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mobile.rule=Host(`m.votre-domaine.com`)"
        - "traefik.http.routers.mobile.entrypoints=websecure"
        - "traefik.http.routers.mobile.tls.certresolver=myresolver"
        - "traefik.http.services.mobile.loadbalancer.server.port=80"

networks:
  public:
    driver: overlay
  internal:
    driver: overlay

volumes:
  db_data:
  traefik-certificates:
