version: '3.8'

services:

  # ── Base de données ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: michelin_app
      POSTGRES_USER: michelin_user
      POSTGRES_PASSWORD: michelin_secret_2025
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal

  # ── API Symfony (PHP-FPM) ────────────────────────────────
  server:
    image: michelin-server:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://michelin_user:michelin_secret_2025@db:5432/michelin_app?serverVersion=16&charset=utf8"
      APP_ENV: prod
      APP_SECRET: "5e8e7a8e7a8e7a8e7a8e7a8e7a8e7a8e"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY}"
      CORS_ALLOW_ORIGIN: "^http://54\.37\.159\.216(:[0-9]+)?$$"
    depends_on:
      - db
    networks:
      - internal

  # ── Nginx frontal pour l'API ─────────────────────────────
  server-nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - internal

  # ── Frontend Client Desktop ──────────────────────────────
  client:
    image: michelin-client:latest
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - public

  # ── Mobile PWA ───────────────────────────────────────────
  mobile:
    image: michelin-mobile:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - public

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  db_data:
